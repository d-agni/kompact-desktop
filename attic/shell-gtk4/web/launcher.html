<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>kompact launcher</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <div id="backdrop">
    <div id="card" role="dialog" aria-label="Applications">
      <input id="search" type="search" placeholder="Type to search applications" autocomplete="off" spellcheck="false">
      <ul id="list" role="listbox"></ul>
      <div id="empty" hidden>No matching applications</div>
    </div>
  </div>
  <script src="launcher.js"></script>
</body>
</html>
