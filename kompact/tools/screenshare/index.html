<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kompact screen share test</title>
<style>
  :root { --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --card: #fff; --accent: #0071e3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1d1f; --fg: #f5f5f7; --muted: #a1a1a6; --card: #2c2c2e; --accent: #2997ff; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 12px; }
  button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  video { display: block; width: 100%; margin-top: 12px; background: #000; border-radius: 8px; aspect-ratio: 16 / 10; }
  #stats { margin-top: 12px; padding: 10px 12px; background: var(--card); border-radius: 8px; font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Screen share test (kompact 9e-b)</h1>
  <p>Share a monitor the way a video call does (<code>getDisplayMedia</code>). Allow it in Firefox, then click the monitor (slurp).</p>
  <button id="start">Share a screen</button> <button id="stop" disabled>Stop</button>
  <video id="video" autoplay muted playsinline></video>
  <div id="stats">Not sharing.</div>
</main>
<script>
const video = document.getElementById("video");
const stats = document.getElementById("stats");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
let stream = null, timer = null, lastFrames = 0, perSecond = [];

function frames() {
  const q = video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality() : null;
  return q ? q.totalVideoFrames : 0;
}

function tick() {
  const now = frames();
  perSecond.push(now - lastFrames);
  lastFrames = now;
  if (perSecond.length > 15) perSecond.shift();
  const track = stream && stream.getVideoTracks()[0];
  const s = track ? track.getSettings() : {};
  const avg = perSecond.length ? perSecond.reduce((a, b) => a + b, 0) / perSecond.length : 0;
  stats.textContent =
    `track: ${track ? track.label : "-"} (${track ? track.readyState : "-"})\n` +
    `size: ${video.videoWidth}x${video.videoHeight}, settings ${s.width || "?"}x${s.height || "?"} @ ${s.frameRate || "?"} fps\n` +
    `frames shown: ${now}; last 15 s per second: ${perSecond.join(" ")} (avg ${avg.toFixed(1)})`;
}

async function start() {
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
  } catch (e) {
    stats.textContent = `getDisplayMedia failed: ${e.name}: ${e.message}`;
    return;
  }
  video.srcObject = stream;
  stream.getVideoTracks()[0].addEventListener("ended", stop);
  lastFrames = frames();
  perSecond = [];
  timer = setInterval(tick, 1000);
  startBtn.disabled = true;
  stopBtn.disabled = false;
}

function stop() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  clearInterval(timer);
  video.srcObject = null;
  startBtn.disabled = false;
  stopBtn.disabled = true;
  stats.textContent += "\nStopped.";
}

startBtn.addEventListener("click", start);
stopBtn.addEventListener("click", stop);
</script>
</body>
</html>
