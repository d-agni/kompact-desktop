<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Siva</title>
  <link rel="stylesheet" href="siva.css">
</head>
<body class="right">
  <!-- 19b: Siva, the desktop's assistant (src-tauri/src/assistant/siva.rs). -->
  <div id="bubble" class="bubble" hidden>
    <div id="bubble-text" role="status" aria-live="polite"></div>
    <!-- 19c: typing a request -->
    <form id="ask" class="ask" hidden autocomplete="off">
      <label for="ask-input" class="ask-label">What can I do for you?</label>
      <input id="ask-input" type="text" maxlength="300" placeholder="Try “volume 30” or “help”" spellcheck="false">
    </form>
    <div id="bubble-buttons" class="bubble-buttons" hidden></div>
  </div>
  <div id="menu" class="menu" role="menu" hidden>
    <button role="menuitem" data-act="moods">Show my moods</button>
    <div class="menu-label">Move to</div>
    <div class="corners">
      <button role="menuitem" data-corner="top-left" aria-label="Top left corner">↖</button>
      <button role="menuitem" data-corner="top-right" aria-label="Top right corner">↗</button>
      <button role="menuitem" data-corner="bottom-left" aria-label="Bottom left corner">↙</button>
      <button role="menuitem" data-corner="bottom-right" aria-label="Bottom right corner">↘</button>
    </div>
    <button role="menuitem" data-act="motion" id="menu-motion">Less movement</button>
    <button role="menuitem" data-act="hide">Hide Siva</button>
  </div>
  <div id="siva" class="siva" aria-label="Siva" title="Siva: click to ask me something, right-click for more, drag to move">

  </div>
