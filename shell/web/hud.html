<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Siva</title>
  <link rel="stylesheet" href="hud.css">
</head>
<body class="s-hidden">
  <!-- 19h: the assistant's HUD under the menu bar (src-tauri/src/assistant/hud.rs). -->
  <div id="hud" class="hud" hidden role="dialog" aria-label="Siva">
    <div class="top">
      <div class="reactor" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="64" height="64">
          <circle class="r-outer" cx="32" cy="32" r="29" />
          <circle class="r-ticks" cx="32" cy="32" r="25" />
          <circle class="r-arc" cx="32" cy="32" r="20" />
          <circle class="r-inner" cx="32" cy="32" r="14" />
          <circle class="r-core" cx="32" cy="32" r="8" />
        </svg>
      </div>
      <div class="head">
        <div class="title"><span class="name">SIVA</span><span id="status" class="status" role="status" aria-live="polite"></span></div>
        <canvas id="wave" class="wave" width="300" height="56" aria-hidden="true"></canvas>
      </div>
      <button id="close" class="icon" type="button" aria-label="Close" title="Close">
        <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6"/></svg>
      </button>
    </div>
    <div id="heard" class="heard"></div>
    <div id="reply" class="reply" aria-live="polite"></div>
    <form id="type" class="type" hidden autocomplete="off">
      <input id="type-input" type="text" maxlength="300" placeholder="Try “volume 30” or “help”" spellcheck="false" aria-label="Ask Siva">
    </form>
    <div id="buttons" class="buttons"></div>
    <div class="foot">
      <span id="mic" class="mic"></span>
      <button id="done" class="pill" type="button" title="Done speaking">Done</button>
      <button id="speak" class="pill" type="button" title="Speak again">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5" fill="currentColor"/><path d="M3.2 7.5a4.8 4.8 0 0 0 9.6 0M8 12.3V14.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Speak
      </button>
      <button id="kbd" class="pill" type="button" title="Type instead">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="1.2" y="4" width="13.6" height="8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.6 6.4h.8M6 6.4h.8M8.4 6.4h.8M10.8 6.4h.8M4.4 9.6h7.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Type
      </button>
    </div>
  </div>
  <script src="hud.js"></script>
</body>
</html>
