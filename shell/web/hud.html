<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Siva</title>
  <link rel="stylesheet" href="hud.css">
</head>
<body class="s-hidden">
  <!-- 19h: the assistant's HUD under the menu bar (src-tauri/src/assistant/hud.rs). -->
  <div id="hud" class="hud" hidden role="dialog" aria-label="Siva">
    <div class="top">
      <div class="reactor" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="64" height="64">
          <circle class="r-outer" cx="32" cy="32" r="29" />
          <circle class="r-ticks" cx="32" cy="32" r="25" />
          <circle class="r-arc" cx="32" cy="32" r="20" />
          <circle class="r-inner" cx="32" cy="32" r="14" />
          <circle class="r-core" cx="32" cy="32" r="8" />
        </svg>
      </div>
      <div class="head">
        <div class="title">
          <span class="name">SIVA</span><span id="status" class="status" role="status" aria-live="polite"></span>
          <span id="count" class="count"></span>
          <!-- 20c-2: the window's own controls -->
          <span class="ctl">
            <button id="recent-btn" class="icon" type="button" aria-label="Recent requests" title="Recent requests" aria-expanded="false">
              <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none"/><path d="M8 4.6V8l2.4 1.6" fill="none"/></svg>
            </button>
            <button id="pin" class="icon" type="button" aria-label="Keep open" title="Keep open" aria-pressed="false">
              <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M6 2h4l-.6 4 2.6 2.4H4L6.6 6zM8 8.4V14" fill="none" stroke-linejoin="round"/></svg>
            </button>
            <button id="mini" class="icon" type="button" aria-label="Make small" title="Make small" aria-pressed="false">
              <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 5h6"/></svg>
            </button>
            <button id="close" class="icon" type="button" aria-label="Close" title="Close">
              <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6"/></svg>
            </button>
          </span>
        </div>
        <canvas id="wave" class="wave" width="300" height="56" aria-hidden="true"></canvas>
      </div>
    </div>
    <div class="heard-row">
      <div id="heard" class="heard"></div>
      <!-- 19j: not what you said? Fix it, and Siva remembers. -->
      <button id="fix" class="icon fix" type="button" aria-label="Not what I said: fix it" title="Not what I said: fix it, and I'll remember">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M10.5 2.5l3 3-8 8H2.5v-3z M9 4l3 3"/></svg>
      </button>
    </div>
    <!-- 19e: a request of several steps, live -->
    <ol id="plan" class="plan" aria-label="Plan"></ol>
    <!-- 20c-2: a finished plan folds into one line -->
    <button id="plan-sum" class="plan-sum" type="button" hidden aria-expanded="false"></button>
    <div id="reply" class="reply" aria-live="polite"></div>
    <!-- 20d: what a look-up found -->
    <ol id="links" class="links" aria-label="What I found"></ol>
    <form id="type" class="type" hidden autocomplete="off">
      <input id="type-input" type="text" maxlength="300" placeholder="Try “volume 30” or “help”" spellcheck="false" aria-label="Ask Siva">
    </form>
    <div id="buttons" class="buttons"></div>
    <!-- 20c: the other tasks, running or just done -->
    <div id="tasks" class="tasks" aria-label="Other tasks"></div>
    <!-- 20c-2: recent requests, only when asked for (click one to ask it again) -->
    <div id="recent" class="recent" hidden>
      <div class="recent-head"><span>RECENT</span><button id="recent-clear" class="link" type="button">Clear</button></div>
      <ol id="recent-list"></ol>
    </div>
    <div class="foot">
      <span id="mic" class="mic"></span>
      <button id="done" class="pill" type="button" title="Done speaking">Done</button>
      <button id="stop" class="pill" type="button" title="Stop before the next step">Stop</button>
      <button id="speak" class="pill" type="button" title="Speak again">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5" fill="currentColor"/><path d="M3.2 7.5a4.8 4.8 0 0 0 9.6 0M8 12.3V14.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Speak
      </button>
      <button id="kbd" class="pill" type="button" title="Type instead">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="1.2" y="4" width="13.6" height="8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.6 6.4h.8M6 6.4h.8M8.4 6.4h.8M10.8 6.4h.8M4.4 9.6h7.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Type
      </button>
    </div>
  </div>
  <script src="hud.js"></script>
</body>
</html>
